<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алексей Кичигин</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080311;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Живой градиентный фон */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #17092c 0%, #080311 100%);
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: #6b21a8;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.6; }
        }

        /* Контейнер */
        .container {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
        }

        /* Левый блок (Алексей) */
        .hero-section {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding: 100px 20px 20px 20px;
        }

        .kichigin-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .kichigin-img-container {
            animation: floatHero 5s ease-in-out infinite alternate;
        }

        @keyframes floatHero {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        .kichigin-img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            user-select: none;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.35));
            transition: filter 0.3s ease;
        }

        .kichigin-wrapper:hover .kichigin-img {
            filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.6));
        }

        /* Спичбабблы */
        .speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-15px) scale(0.9);
            background: rgba(18, 10, 36, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: rgba(168, 85, 247, 0.8) transparent transparent transparent;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .video-bubble {
            padding: 10px;
            white-space: normal;
        }

        .video-bubble video {
            width: 280px;
            max-width: 80vw;
            border-radius: 14px;
            display: block;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* Правый блок (Контент) */
        .content-section {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(15, 7, 32, 0.45);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(168, 85, 247, 0.15);
        }

        .content-card {
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-title {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            letter-spacing: -0.5px;
        }

        .content-text {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #d8b4fe;
            text-align: center;
        }

        .img-wrapper {
            position: relative;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(88, 28, 135, 0.2));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            margin-bottom: 30px;
        }

        .img-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .content-img {
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            display: block;
        }

        /* Контейнер плеейра Яндекс Музыки */
        .music-player-wrapper {
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .music-player-wrapper iframe {
            width: 100%;
            height: 210px;
            display: block;
            border: none;
        }

        /* Мобильные стили */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .hero-section {
                min-height: 55vh;
                padding-top: 100px;
                align-items: center;
            }

            .kichigin-img {
                max-height: 38vh;
            }

            .content-section {
                padding: 50px 20px;
                border-left: none;
                border-top: 1px solid rgba(168, 85, 247, 0.15);
            }

            .content-title {
                font-size: 2rem;
            }

            .speech-bubble {
                font-size: 0.95rem;
                padding: 12px 18px;
            }

            .video-bubble video {
                width: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="container">
        <section class="hero-section">
            <div class="kichigin-wrapper" id="kichiginWrapper">
                
                <div class="speech-bubble" id="textBubble">
                    я не пизжу сейчас, мне это зачем
                </div>

                <div class="speech-bubble video-bubble" id="videoBubble">
                    <video id="musorVideo" src="musordrop.mp4" playsinline></video>
                </div>

                <div class="kichigin-img-container">
                    <img src="kichigin.png" alt="Алексей Кичигин" class="kichigin-img">
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="content-card">
                <h1 class="content-title">Кичигин Алексей Викторович</h1>
                <p class="content-text">
                    Здесь находится описание главного еблана Свердловской области. Нажмите на Кичигина слева, чтобы проверить его на пиздабольство.
                </p>
                
                <div class="img-wrapper">
                    <img src="photo.png" alt="Контентное фото" class="content-img">
                </div>

                <div class="music-player-wrapper">
                    <iframe frameborder="0" allow="clipboard-write" src="https://music.yandex.ru/iframe/album/28122625/track/119057912"></iframe>
                </div>
            </div>
        </section>
    </div>

    <audio id="pizdabolAudio" src="pizdabol.ogg" preload="auto"></audio>

    <script>
        const wrapper = document.getElementById('kichiginWrapper');
        const textBubble = document.getElementById('textBubble');
        const videoBubble = document.getElementById('videoBubble');
        const audio = document.getElementById('pizdabolAudio');
        const video = document.getElementById('musorVideo');

        let isAnimating = false;
        let videoTimeout = null;

        // Переменная для логики строгого чередования (null при старте)
        let showTextNext = null;

        // Параллакс мыши
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.025;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.025;
                wrapper.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                wrapper.style.transform = 'none';
            }
        });

        function hideBubbles() {
            textBubble.classList.remove('active');
            videoBubble.classList.remove('active');
            
            audio.pause();
            audio.currentTime = 0;
            
            video.pause();
            video.currentTime = 0;

            if (videoTimeout) {
                clearTimeout(videoTimeout);
                videoTimeout = null;
            }
        }

        // Логика клика: первый клик случайный (50/50), далее чередование
        wrapper.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            hideBubbles();

            // Если это первый клик — определяем случайный старт
            if (showTextNext === null) {
                showTextNext = Math.random() < 0.5;
            }

            if (showTextNext) {
                textBubble.classList.add('active');
                audio.play().catch(() => {});

                setTimeout(() => {
                    textBubble.classList.remove('active');
                    isAnimating = false;
                }, 3000);
            } else {
                videoBubble.classList.add('active');
                video.currentTime = 0;
                video.play().catch(() => {});

                video.onended = () => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                };

                videoTimeout = setTimeout(() => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                }, 13000);
            }

            // Переключаем на следующий клик
            showTextNext = !showTextNext;
        });
    </script>
</body>
</html>
