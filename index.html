<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алексей Кичигин</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080311;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Живой градиентный фон */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #17092c 0%, #080311 100%);
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: #a855f7;
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: #6b21a8;
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.6; }
        }

        /* Контейнер */
        .container {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
        }

        /* Левый блок (Алексей) */
        .hero-section {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding: 100px 20px 20px 20px;
        }

        .kichigin-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .kichigin-img-container {
            animation: floatHero 5s ease-in-out infinite alternate;
        }

        @keyframes floatHero {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        .kichigin-img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            user-select: none;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.35));
            transition: filter 0.3s ease;
        }

        .kichigin-wrapper:hover .kichigin-img {
            filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.6));
        }

        /* Спичбабблы */
        .speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-15px) scale(0.9);
            background: rgba(18, 10, 36, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: rgba(168, 85, 247, 0.8) transparent transparent transparent;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .video-bubble {
            padding: 10px;
            white-space: normal;
        }

        .video-bubble video {
            width: 280px;
            max-width: 80vw;
            border-radius: 14px;
            display: block;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* Правый блок (Контент) */
        .content-section {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(15, 7, 32, 0.45);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(168, 85, 247, 0.15);
        }

        .content-card {
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-title {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            letter-spacing: -0.5px;
        }

        .content-text {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #d8b4fe;
            text-align: center;
        }

        .img-wrapper {
            position: relative;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(88, 28, 135, 0.2));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            margin-bottom: 30px;
        }

        .img-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .content-img {
            width: 100%;
            max-width: 500px;
            border-radius: 14px;
            display: block;
        }

        /* Анимации для переключателей и плееров */
        .music-player-wrapper {
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: #000000;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .platform-group {
            transition: opacity 0.35s ease;
        }

        .track-item {
            display: block;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            max-height: 0;
            transform: translateY(6px);
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.35s ease,
                        max-height 0.35s ease;
        }

        .track-item.active {
            opacity: 1;
            visibility: visible;
            max-height: 220px;
            transform: translateY(0);
        }

        .soundcloud-item.active {
            max-height: 170px;
        }

        .track-item iframe {
            width: 100%;
            height: 210px;
            border: none;
            display: block;
        }

        .soundcloud-item iframe {
            height: 166px;
        }

        /* Переключатель платформ */
        .platform-toggle {
            display: flex;
            background: rgba(23, 9, 44, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 30px;
            padding: 4px;
            margin-top: 15px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .platform-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #d8b4fe;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.3s ease, background 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease;
            z-index: 1;
        }

        .platform-btn:active {
            transform: scale(0.96);
        }

        /* Брендовые стили для активных кнопок */
        .platform-btn.active.yandex-active {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            color: #000000;
            box-shadow: 0 0 16px rgba(255, 204, 0, 0.5);
        }

        .platform-btn.active.soundcloud-active {
            background: linear-gradient(135deg, #ff5500 0%, #ff2200 100%);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 85, 0, 0.5);
        }

        /* Динамические свечения рамки тумблера */
        .platform-toggle.yandex-theme {
            border-color: rgba(255, 204, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }

        .platform-toggle.soundcloud-theme {
            border-color: rgba(255, 85, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
        }

        /* Слайдер треков */
        .track-selector {
            width: 100%;
            max-width: 500px;
            margin-top: 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 4px;
            scrollbar-width: thin;
            scrollbar-color: #a855f7 rgba(15, 7, 32, 0.5);
            scroll-behavior: smooth;
        }

        .track-selector::-webkit-scrollbar {
            height: 6px;
        }

        .track-selector::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .track-btn {
            background: rgba(23, 9, 44, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .track-btn:hover {
            border-color: rgba(168, 85, 247, 0.8);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .track-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .track-btn.active {
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            color: #ffffff;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            transform: scale(1.03);
        }

        /* Мобильные стили */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .hero-section {
                min-height: 55vh;
                padding-top: 100px;
                align-items: center;
            }

            .kichigin-img {
                max-height: 38vh;
            }

            .content-section {
                padding: 50px 20px;
                border-left: none;
                border-top: 1px solid rgba(168, 85, 247, 0.15);
            }

            .content-title {
                font-size: 2rem;
            }

            .speech-bubble {
                font-size: 0.95rem;
                padding: 12px 18px;
            }

            .video-bubble video {
                width: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="container">
        <section class="hero-section">
            <div class="kichigin-wrapper" id="kichiginWrapper">
                
                <div class="speech-bubble" id="textBubble">
                    я не пизжу сейчас, мне это зачем
                </div>

                <div class="speech-bubble video-bubble" id="videoBubble">
                    <video id="musorVideo" src="musordrop.mp4" playsinline></video>
                </div>

                <div class="kichigin-img-container">
                    <img src="kichigin.png" alt="Алексей Кичигин" class="kichigin-img">
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="content-card">
                <h1 class="content-title">Кичигин Алексей Викторович</h1>
                <p class="content-text">
                    Здесь находится описание главного еблана Свердловской области. Нажмите на Кичигина слева, чтобы проверить его на пиздабольство.
                </p>
                
                <div class="img-wrapper">
                    <img src="photo.png" alt="Контентное фото" class="content-img">
                </div>

                <!-- Блок плееров -->
                <div class="music-player-wrapper">
                    <!-- Яндекс Музыка -->
                    <div class="platform-group yandex-group">
                        <div class="track-item active" frameborder="0" allow="clipboard-write">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057912"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057907"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057909"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057923"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057914"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057930"></iframe>
                        </div>
                    </div>

                    <!-- SoundCloud -->
                    <div class="platform-group soundcloud-group" style="display: none;">
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661173662&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661172651&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661172825&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661174574&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661173770&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661175462&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                    </div>
                </div>

                <!-- Переключатель источников -->
                <div class="platform-toggle yandex-theme">
                    <button class="platform-btn active yandex-active" id="btnYandex" onclick="switchPlatform('yandex')">Я.Музыка</button>
                    <button class="platform-btn" id="btnSoundcloud" onclick="switchPlatform('soundcloud')">SoundCloud</button>
                </div>

                <!-- Переключатель треков -->
                <div class="track-selector">
                    <button class="track-btn active" onclick="switchTrack(0)">Я утонул в своей ванной</button>
                    <button class="track-btn" onclick="switchTrack(1)">Ржавый</button>
                    <button class="track-btn" onclick="switchTrack(2)">Грязный кайф</button>
                    <button class="track-btn" onclick="switchTrack(3)">Шмон</button>
                    <button class="track-btn" onclick="switchTrack(4)">Холодно</button>
                    <button class="track-btn" onclick="switchTrack(5)">Я все</button>
                </div>
            </div>
        </section>
    </div>

    <audio id="pizdabolAudio" src="pizdabol.ogg" preload="auto"></audio>

    <script>
        const wrapper = document.getElementById('kichiginWrapper');
        const textBubble = document.getElementById('textBubble');
        const videoBubble = document.getElementById('videoBubble');
        const audio = document.getElementById('pizdabolAudio');
        const video = document.getElementById('musorVideo');

        let isAnimating = false;
        let videoTimeout = null;
        let showTextNext = null;

        let currentPlatform = 'yandex';
        let currentTrackIndex = 0;

        // Переключение платформы с анимацией и брендовыми цветами
        function switchPlatform(platform) {
            currentPlatform = platform;

            const yandexGroup = document.querySelector('.yandex-group');
            const soundcloudGroup = document.querySelector('.soundcloud-group');
            const btnYandex = document.getElementById('btnYandex');
            const btnSoundcloud = document.getElementById('btnSoundcloud');
            const toggleContainer = document.querySelector('.platform-toggle');

            if (platform === 'yandex') {
                yandexGroup.style.display = 'block';
                soundcloudGroup.style.display = 'none';

                btnYandex.classList.add('active', 'yandex-active');
                btnYandex.classList.remove('soundcloud-active');
                
                btnSoundcloud.classList.remove('active', 'soundcloud-active', 'yandex-active');

                toggleContainer.classList.add('yandex-theme');
                toggleContainer.classList.remove('soundcloud-theme');
            } else {
                yandexGroup.style.display = 'none';
                soundcloudGroup.style.display = 'block';

                btnSoundcloud.classList.add('active', 'soundcloud-active');
                btnSoundcloud.classList.remove('yandex-active');

                btnYandex.classList.remove('active', 'yandex-active', 'soundcloud-active');

                toggleContainer.classList.add('soundcloud-theme');
                toggleContainer.classList.remove('yandex-theme');
            }

            updateTrackVisibility();
        }

        // Переключение трека по индексу
        function switchTrack(index) {
            currentTrackIndex = index;
            updateTrackVisibility();

            const buttons = document.querySelectorAll('.track-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        // Обновление видимости активного трека
        function updateTrackVisibility() {
            const activeGroupClass = currentPlatform === 'yandex' ? '.yandex-group' : '.soundcloud-group';
            const trackItems = document.querySelectorAll(`${activeGroupClass} .track-item`);

            trackItems.forEach((item, i) => {
                item.classList.toggle('active', i === currentTrackIndex);
            });
        }

        // Инициализируем верную тему при загрузке
        switchPlatform('yandex');

        // Параллакс мыши
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.025;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.025;
                wrapper.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                wrapper.style.transform = 'none';
            }
        });

        function hideBubbles() {
            textBubble.classList.remove('active');
            videoBubble.classList.remove('active');
            
            audio.pause();
            audio.currentTime = 0;
            
            video.pause();
            video.currentTime = 0;

            if (videoTimeout) {
                clearTimeout(videoTimeout);
                videoTimeout = null;
            }
        }

        // Логика клика 50/50 + чередование
        wrapper.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            hideBubbles();

            if (showTextNext === null) {
                showTextNext = Math.random() < 0.5;
            }

            if (showTextNext) {
                textBubble.classList.add('active');
                audio.play().catch(() => {});

                setTimeout(() => {
                    textBubble.classList.remove('active');
                    isAnimating = false;
                }, 3000);
            } else {
                videoBubble.classList.add('active');
                video.currentTime = 0;
                video.play().catch(() => {});

                video.onended = () => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                };

                videoTimeout = setTimeout(() => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                }, 13000);
            }

            showTextNext = !showTextNext;
        });
    </script>
</body>
</html>
