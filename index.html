<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алексей Кичигин</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080311;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Живой градиентный фон */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #17092c 0%, #080311 100%);
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 40vw;
            height: 40vw;
            background: #a855f7;
            top: -10vw;
            left: -10vw;
        }

        .glow-2 {
            width: 45vw;
            height: 45vw;
            background: #6b21a8;
            bottom: -15vw;
            right: -10vw;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(50px, 30px); opacity: 0.6; }
        }

        /* Контейнер */
        .container {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            width: 100%;
        }

        /* Левый блок (Алексей) */
        .hero-section {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            padding: 40px 20px 0px 20px;
        }

        .kichigin-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .kichigin-img-container {
            animation: floatHero 5s ease-in-out infinite alternate;
        }

        @keyframes floatHero {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        .kichigin-img {
            max-width: 100%;
            height: auto;
            max-height: 82vh;
            object-fit: contain;
            display: block;
            user-select: none;
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.35));
            transition: filter 0.3s ease;
        }

        .kichigin-wrapper:hover .kichigin-img {
            filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.6));
        }

        /* Спичбабблы */
        .speech-bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-15px) scale(0.9);
            background: rgba(18, 10, 36, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.2vw, 1.3rem);
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: rgba(168, 85, 247, 0.8) transparent transparent transparent;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .video-bubble {
            padding: 10px;
            white-space: normal;
        }

        .video-bubble video {
            width: clamp(220px, 20vw, 360px);
            max-width: 80vw;
            border-radius: 14px;
            display: block;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* Правый блок (Контент) */
        .content-section {
            flex: 1;
            padding: 3vh 3vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(15, 7, 32, 0.45);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(168, 85, 247, 0.15);
        }

        .content-card {
            max-width: clamp(480px, 45vw, 750px);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vh, 24px);
        }

        .content-title {
            font-size: clamp(2rem, 3vw, 3.8rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            letter-spacing: -0.5px;
        }

        .content-text {
            font-size: clamp(0.95rem, 1.1vw, 1.4rem);
            line-height: 1.5;
            color: #d8b4fe;
            text-align: center;
        }

        .img-wrapper {
            position: relative;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(88, 28, 135, 0.2));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        .img-wrapper:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .content-img {
            width: 100%;
            max-height: clamp(140px, 22vh, 320px);
            object-fit: cover;
            border-radius: 14px;
            display: block;
        }

        /* Контейнер плееров */
        .music-player-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: #000000;
        }

        .platform-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
            transform: scale(0.98);
        }

        .platform-group.active-platform {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1);
        }

        .track-item {
            display: none;
            width: 100%;
            height: 100%;
        }

        .track-item.active {
            display: block;
        }

        .track-item iframe {
            width: 100%;
            height: 210px;
            border: none;
            display: block;
        }

        /* Переключатель платформ */
        .platform-toggle {
            position: relative;
            display: flex;
            background: rgba(23, 9, 44, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 30px;
            padding: 4px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .platform-thumb {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            border-radius: 25px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), background 0.4s ease, box-shadow 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .platform-toggle.yandex-mode .platform-thumb {
            transform: translateX(0);
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            box-shadow: 0 0 16px rgba(255, 204, 0, 0.5);
        }

        .platform-toggle.soundcloud-mode .platform-thumb {
            transform: translateX(100%);
            background: linear-gradient(135deg, #ff5500 0%, #ff2200 100%);
            box-shadow: 0 0 16px rgba(255, 85, 0, 0.5);
        }

        .platform-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #d8b4fe;
            padding: clamp(8px, 1vh, 12px) 16px;
            border-radius: 25px;
            font-size: clamp(0.85rem, 0.9vw, 1.05rem);
            font-weight: 700;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.15s ease;
            z-index: 1;
        }

        .platform-btn:active {
            transform: scale(0.96);
        }

        .platform-btn.active-yandex {
            color: #000000;
        }

        .platform-btn.active-soundcloud {
            color: #ffffff;
        }

        .platform-toggle.yandex-theme {
            border-color: rgba(255, 204, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }

        .platform-toggle.soundcloud-theme {
            border-color: rgba(255, 85, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
        }

        /* Слайдер треков */
        .track-selector {
            position: relative;
            width: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 4px;
            scrollbar-width: thin;
            scrollbar-color: #a855f7 rgba(15, 7, 32, 0.5);
            scroll-behavior: smooth;
        }

        .track-selector::-webkit-scrollbar {
            height: 6px;
        }

        .track-selector::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 10px;
        }

        .slider-thumb {
            position: absolute;
            top: 6px;
            left: 0;
            height: calc(100% - 12px);
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 0;
        }

        .track-btn {
            position: relative;
            z-index: 1;
            background: rgba(23, 9, 44, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: clamp(6px, 0.8vh, 10px) 16px;
            border-radius: 20px;
            font-size: clamp(0.8rem, 0.85vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
        }

        .track-btn:hover {
            border-color: rgba(168, 85, 247, 0.8);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .track-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .track-btn.active {
            background: transparent;
            color: #ffffff;
            border-color: transparent;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .hero-section {
                min-height: 50vh;
                padding-top: 60px;
                align-items: center;
            }

            .kichigin-img {
                max-height: 40vh;
            }

            .content-section {
                padding: 40px 20px;
                border-left: none;
                border-top: 1px solid rgba(168, 85, 247, 0.15);
            }

            .speech-bubble {
                font-size: 0.95rem;
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="container">
        <section class="hero-section">
            <div class="kichigin-wrapper" id="kichiginWrapper">
                
                <div class="speech-bubble" id="textBubble">
                    я не пизжу сейчас, мне это зачем
                </div>

                <div class="speech-bubble video-bubble" id="videoBubble">
                    <video id="musorVideo" src="musordrop.mp4" playsinline></video>
                </div>

                <div class="kichigin-img-container">
                    <img src="kichigin.png" alt="Алексей Кичигин" class="kichigin-img">
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="content-card">
                <h1 class="content-title">Кичигин Алексей Викторович</h1>
                <p class="content-text">
                    Здесь находится описание главного еблана Свердловской области. Нажмите на Кичигина слева, чтобы проверить его на пиздабольство.
                </p>
                
                <div class="img-wrapper">
                    <img src="photo.png" alt="Контентное фото" class="content-img">
                </div>

                <!-- Блок плееров -->
                <div class="music-player-wrapper">
                    <!-- Яндекс Музыка -->
                    <div class="platform-group yandex-group active-platform">
                        <div class="track-item active">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057912"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057907"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057909"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057923"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057914"></iframe>
                        </div>
                        <div class="track-item">
                            <iframe src="https://music.yandex.ru/iframe/album/28122625/track/119057930"></iframe>
                        </div>
                    </div>

                    <!-- SoundCloud -->
                    <div class="platform-group soundcloud-group">
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661173662&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661172651&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661172825&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661174574&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661173770&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                        <div class="track-item soundcloud-item">
                            <iframe width="100%" height="210" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1661175462&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=false"></iframe>
                        </div>
                    </div>
                </div>

                <!-- Переключатель источников -->
                <div class="platform-toggle yandex-mode yandex-theme" id="platformToggle">
                    <div class="platform-thumb" id="platformThumb"></div>
                    <button class="platform-btn active-yandex" id="btnYandex" onclick="switchPlatform('yandex')">Я.Музыка</button>
                    <button class="platform-btn" id="btnSoundcloud" onclick="switchPlatform('soundcloud')">SoundCloud</button>
                </div>

                <!-- Переключатель треков -->
                <div class="track-selector" id="trackSelector">
                    <div class="slider-thumb" id="sliderThumb"></div>
                    <button class="track-btn active" onclick="switchTrack(0)">Я утонул в своей ванной</button>
                    <button class="track-btn" onclick="switchTrack(1)">Ржавый</button>
                    <button class="track-btn" onclick="switchTrack(2)">Грязный кайф</button>
                    <button class="track-btn" onclick="switchTrack(3)">Шмон</button>
                    <button class="track-btn" onclick="switchTrack(4)">Холодно</button>
                    <button class="track-btn" onclick="switchTrack(5)">Я все</button>
                </div>
            </div>
        </section>
    </div>

    <audio id="pizdabolAudio" src="pizdabol.ogg" preload="auto"></audio>

    <script>
        const wrapper = document.getElementById('kichiginWrapper');
        const textBubble = document.getElementById('textBubble');
        const videoBubble = document.getElementById('videoBubble');
        const audio = document.getElementById('pizdabolAudio');
        const video = document.getElementById('musorVideo');

        let isAnimating = false;
        let videoTimeout = null;
        let showTextNext = null;

        let currentPlatform = 'yandex';
        let currentTrackIndex = 0;

        function switchPlatform(platform) {
            currentPlatform = platform;

            const yandexGroup = document.querySelector('.yandex-group');
            const soundcloudGroup = document.querySelector('.soundcloud-group');
            const btnYandex = document.getElementById('btnYandex');
            const btnSoundcloud = document.getElementById('btnSoundcloud');
            const toggleContainer = document.getElementById('platformToggle');

            if (platform === 'yandex') {
                yandexGroup.classList.add('active-platform');
                soundcloudGroup.classList.remove('active-platform');

                toggleContainer.classList.add('yandex-mode', 'yandex-theme');
                toggleContainer.classList.remove('soundcloud-mode', 'soundcloud-theme');

                btnYandex.classList.add('active-yandex');
                btnSoundcloud.classList.remove('active-soundcloud');
            } else {
                soundcloudGroup.classList.add('active-platform');
                yandexGroup.classList.remove('active-platform');

                toggleContainer.classList.add('soundcloud-mode', 'soundcloud-theme');
                toggleContainer.classList.remove('yandex-mode', 'yandex-theme');

                btnSoundcloud.classList.add('active-soundcloud');
                btnYandex.classList.remove('active-yandex');
            }

            updateTrackVisibility();
        }

        function moveSliderThumb(index) {
            const buttons = document.querySelectorAll('.track-btn');
            const thumb = document.getElementById('sliderThumb');
            const targetBtn = buttons[index];

            if (targetBtn && thumb) {
                thumb.style.width = `${targetBtn.offsetWidth}px`;
                thumb.style.transform = `translateX(${targetBtn.offsetLeft}px)`;
            }
        }

        function switchTrack(index) {
            currentTrackIndex = index;
            updateTrackVisibility();

            const buttons = document.querySelectorAll('.track-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            moveSliderThumb(index);
        }

        function updateTrackVisibility() {
            const activeGroupClass = currentPlatform === 'yandex' ? '.yandex-group' : '.soundcloud-group';
            
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('active');
            });

            const activeItems = document.querySelectorAll(`${activeGroupClass} .track-item`);
            if (activeItems[currentTrackIndex]) {
                activeItems[currentTrackIndex].classList.add('active');
            }
        }

        window.addEventListener('load', () => {
            switchPlatform('yandex');
            switchTrack(0);
        });

        window.addEventListener('resize', () => {
            moveSliderThumb(currentTrackIndex);
            if (window.innerWidth <= 768) {
                wrapper.style.transform = 'none';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.025;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.025;
                wrapper.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
            }
        });

        function hideBubbles() {
            textBubble.classList.remove('active');
            videoBubble.classList.remove('active');
            
            audio.pause();
            audio.currentTime = 0;
            
            video.pause();
            video.currentTime = 0;

            if (videoTimeout) {
                clearTimeout(videoTimeout);
                videoTimeout = null;
            }
        }

        wrapper.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;

            hideBubbles();

            if (showTextNext === null) {
                showTextNext = Math.random() < 0.5;
            }

            if (showTextNext) {
                textBubble.classList.add('active');
                audio.play().catch(() => {});

                setTimeout(() => {
                    textBubble.classList.remove('active');
                    isAnimating = false;
                }, 3000);
            } else {
                videoBubble.classList.add('active');
                video.currentTime = 0;
                video.play().catch(() => {});

                video.onended = () => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                };

                videoTimeout = setTimeout(() => {
                    if (videoBubble.classList.contains('active')) {
                        hideBubbles();
                        isAnimating = false;
                    }
                }, 13000);
            }

            showTextNext = !showTextNext;
        });
    </script>
</body>
</html>
